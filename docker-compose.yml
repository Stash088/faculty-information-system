version: '3.8'

# Единый App Platform-совместимый стек:
# - Один контейнер с Node.js (отдаёт и API, и SPA)
# - PostgreSQL — внешняя (TimeWeb Managed PostgreSQL)
# - App Platform сам настраивает Nginx и SSL перед приложением
# - Volume для uploads — файлы сохраняются между деплоями

# Для локальной разработки:
# 1. cp .env.example .env
# 2. docker compose up --build
# 3. Открой http://localhost:3050

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faculty_app
    restart: unless-stopped
    ports:
      - "3050:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d
      CLIENT_URL: ${CLIENT_URL:-*}
    volumes:
      - app_uploads:/app/backend/uploads
      - app_logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_uploads:
  app_logs: